ame: SkyOS Core CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Run Test Suite (Pytest & WORM Ledger)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run Pytest Suite
        run: |
          pytest --junitxml=pytest-report.xml || true

      - name: Run WORM Ledger Integrity Tests
        run: |
          if [ -f tests/test_worm_ledger.py ]; then
            python tests/test_worm_ledger.py
          elif [ -f test_worm_ledger.py ]; then
            python test_worm_ledger.py
          fi

      - name: Run Multi-Protocol Agent Bridge Self-Test
        run: |
          if [ -f skyos_agent_bridge.py ]; then
            python skyos_agent_bridge.py
          elif [ -f src/skyos_agent_bridge.py ]; then
            python src/skyos_agent_bridge.py
          fi

  code-linting:
    name: Code Formatting & Type Checks (Flake8 & Black)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linter
        run: |
          pip install flake8 black

      - name: Check Formatting with Black
        run: |
          black --check . || true

      - name: Lint with Flake8
        run: |
          flake8 . --count --max-line-length=120 --statistics || true

  docker-build-validation:
    name: Validate Docker Compose & Distroless Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose V2 Configuration
        run: |
          if [ -f docker-compose-v2.yml ]; then
            docker compose -f docker-compose-v2.yml config
          elif [ -f deploy/docker-compose.yml ]; then
            docker compose -f deploy/docker-compose.yml config
          fi

      - name: Test Build Distroless Container
        run: |
          if [ -f deploy/Dockerfile.distroless ]; then
            docker build -t skyos/core-gateway:ci -f deploy/Dockerfile.distroless .
          fi
