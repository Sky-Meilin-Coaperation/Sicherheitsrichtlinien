name: skyos_assistant
description: "SkyOS Assistant Flutter App with Overlay, Voice Control, Mode Switcher & NotebookLM REST Integration"
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_overlay_window: ^0.4.0
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  http: ^1.2.0
  permission_handler: ^11.3.1
  flutter_code_editor: ^0.3.1
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
